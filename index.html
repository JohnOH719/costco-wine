<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>코스트코 와인 할인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 매장 진열대 앞에서 빠르게 훑어보는 실용 쇼핑 리스트
   IDEA: 코스트코 와인 진열대의 흰 가격표(셸프 태그)
   PICTURE: 종류별 병 그림이 붙은 가격표 카드 그리드
   COLOUR/TYPE: 버건디 바탕, 흰 태그, 할인 빨강 / Noto Sans KR 굵게
   LAYOUT: 글자크기 줄 → 탭·정렬 → 종류·검색 → 가격표 그리드. 모든 크기는 --z 하나로 연동 */
:root{color-scheme:light dark;--z:.8;
--bg:light-dark(#f4efee,#140a0d);--wine:light-dark(#6e1028,#3a0715);--wine2:light-dark(#8d1b36,#5a0d22);
--tag:light-dark(#fff,#211519);--ink:light-dark(#1b1114,#f3e9eb);--mute:light-dark(#6c5d61,#b6a3a8);
--red:light-dark(#d1121f,#ff4d55);--line:light-dark(#e5dcde,#3a2a2f);--chip:light-dark(#fff,#2a1a1f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:calc(18px * var(--z))/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.hero{background:var(--wine);color:#fff;padding:1.2em max(5vw,16px) 1.2em}
.hero h1{font-size:1.5em;line-height:1.2;margin:0 0 .2em;font-weight:900;text-wrap:balance}
.hero p{margin:0;opacity:.85;font-size:.85em}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5em;margin-top:.9em;max-width:40em}
.stat{background:var(--wine2);border-radius:.6em;padding:.5em .75em}
.stat b{display:block;font-size:1.25em;font-weight:900;line-height:1.2;white-space:nowrap}
.stat span{font-size:.8em;opacity:.85}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:.5em max(5vw,16px)}
.row{display:flex;flex-wrap:wrap;gap:.35em;align-items:center;max-width:1240px;margin:0 auto}
.row+.row{margin-top:.4em}
button,select,input{font:inherit;font-size:1em;color:var(--ink)}
.tab,.chip,.zb{min-height:2.2em;padding:0 .75em;border-radius:999px;border:1px solid var(--line);background:var(--chip);cursor:pointer;font-weight:500;white-space:nowrap}
.tab[aria-pressed=true]{background:var(--wine);border-color:var(--wine);color:#fff}
.chip[aria-pressed=true]{border-color:var(--red);color:var(--red);font-weight:700}
.r1{flex-wrap:nowrap;gap:.3em}
.r1 .tab{padding:0 .6em;flex:0 0 auto}
.r1 select{padding:0 .25em;flex:0 1 auto}
.zoom{display:flex;align-items:center;gap:.15em;flex:0 0 auto;margin-left:auto}
.zb{width:2.2em;padding:0;font-weight:700}
.zv{min-width:2.6em;text-align:center;font-size:.9em;color:var(--mute);white-space:nowrap}
select,input{min-height:2.2em;border-radius:.5em;border:1px solid var(--line);background:var(--chip);padding:0 .5em}
input{flex:1 1 10em}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
main{padding:1.2em max(5vw,16px) 2.5em;max-width:calc(1240px + 10vw);margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15em),1fr));gap:.8em}
.t{background:var(--tag);border:1px solid var(--line);border-radius:6px;padding:.9em 1em 1em;display:flex;gap:.8em;box-shadow:0 2px 0 var(--line)}
.t.sale{border-top:.35em solid var(--red)}
.pic{position:relative;flex:0 0 auto;width:4.4em;height:6.6em;align-self:center;display:grid;place-items:center}
.bt{width:2.4em;height:6.4em}
.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--tag);border-radius:4px}
.bd{flex:1;display:flex;flex-direction:column;gap:.35em}
.k{display:flex;justify-content:space-between;gap:.5em;flex-wrap:wrap;font-size:.8125em;color:var(--mute)}
.t h3{margin:0;font-size:1em;line-height:1.35;font-weight:700}
.p{display:flex;align-items:baseline;gap:.5em;flex-wrap:wrap;margin-top:auto}
.p b{font-size:1.75em;font-weight:900;letter-spacing:-.5px;white-space:nowrap}
.p s{color:var(--mute);font-size:.875em;white-space:nowrap}
.off{color:var(--red);font-weight:700;font-size:.875em}
.dd{font-weight:700;padding:0 .5em;border-radius:999px;background:var(--bg);white-space:nowrap}
.dd.hot{background:var(--red);color:#fff}
.per{font-size:.8125em;color:var(--mute)}
.lk{display:inline-flex;align-items:center;justify-content:center;min-height:2.4em;margin-top:.3em;padding:0 .9em;border-radius:.5em;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:.875em;font-weight:500;align-self:flex-start}
.lk:hover{border-color:var(--wine2)}
/* 사진 크기 시안: ?l=a / ?l=b / ?l=c */
html[data-l=a] .pic{width:6.6em;height:9.6em}
html[data-l=a] .bt{width:3em;height:8em}
html[data-l=b] .grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,10.5em),1fr))}
html[data-l=b] .t{flex-direction:column;gap:.6em;padding:.7em}
html[data-l=b] .pic{width:100%;height:12em;align-self:stretch}
html[data-l=b] .bt{width:3.6em;height:9.6em}
html[data-l=b] .p b{font-size:1.45em}
html[data-l=c] .t{align-items:stretch}
html[data-l=c] .pic{width:42%;height:auto;min-height:12em;align-self:stretch}
html[data-l=c] .bt{width:3.4em;height:9em}
.empty{padding:2.5em;text-align:center;color:var(--mute)}
.note{font-size:.8em;color:var(--mute);margin-top:1.8em;line-height:1.7}
.note a{color:inherit}
@media(prefers-reduced-motion:no-preference){.t{animation:in .3s ease both}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".0"/><stop offset=".25" stop-color="#fff" stop-opacity=".45"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <symbol id="b-R" viewBox="0 0 30 80"><rect x="11" y="2" width="8" height="6" rx="1" fill="#2b0a12"/><path d="M11 8h8v14c0 4 8 6 8 14v40a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V36c0-8 8-10 8-14z" fill="#4a0e1c"/><rect x="5" y="44" width="20" height="18" rx="1" fill="#f3ead8"/><rect x="8" y="49" width="14" height="2" fill="#6e1028"/><rect x="9" y="54" width="12" height="1.5" fill="#b9a98c"/><path d="M11 8h8v14c0 4 8 6 8 14v40a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V36c0-8 8-10 8-14z" fill="url(#gl)"/></symbol>
    <symbol id="b-W" viewBox="0 0 30 80"><rect x="11" y="2" width="8" height="6" rx="1" fill="#c9b26a"/><path d="M11 8h8v14c0 4 8 6 8 14v40a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V36c0-8 8-10 8-14z" fill="#d9d08a"/><path d="M5 50h20v26a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z" fill="#c8bb63"/><rect x="5" y="40" width="20" height="18" rx="1" fill="#fff"/><rect x="8" y="45" width="14" height="2" fill="#7a6a2a"/><rect x="9" y="50" width="12" height="1.5" fill="#c9c1a5"/><path d="M11 8h8v14c0 4 8 6 8 14v40a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V36c0-8 8-10 8-14z" fill="url(#gl)"/></symbol>
    <symbol id="b-S" viewBox="0 0 30 80"><path d="M10 1h10v20h-10z" fill="#c9a43a"/><path d="M10 14h10v8c0 4 7 7 7 14v40a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V36c0-7 7-10 7-14z" fill="#1f3d2a"/><path d="M10 14h10v8l-5 3-5-3z" fill="#c9a43a"/><ellipse cx="15" cy="52" rx="10" ry="8" fill="#f6f1e4"/><rect x="9" y="50" width="12" height="2" fill="#1f3d2a"/><path d="M10 14h10v8c0 4 7 7 7 14v40a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V36c0-7 7-10 7-14z" fill="url(#gl)"/></symbol>
    <symbol id="b-D" viewBox="0 0 30 80"><rect x="11" y="18" width="8" height="5" rx="1" fill="#3b2410"/><path d="M11 23h8v8c0 3 7 4 7 10v34a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V41c0-6 7-7 7-10z" fill="#8a4a12"/><rect x="6" y="48" width="18" height="16" rx="1" fill="#f3e6c9"/><rect x="9" y="53" width="12" height="2" fill="#8a4a12"/><path d="M11 23h8v8c0 3 7 4 7 10v34a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V41c0-6 7-7 7-10z" fill="url(#gl)"/></symbol>
  </defs>
</svg>
<header class="hero">
  <h1>코스트코 와인 할인</h1>
  <p>코스트코 코리아 매장 와인 · <span id="upd"></span> 업데이트</p>
  <div class="stats" id="stats"></div>
</header>
<div class="bar">
  <div class="row r1" role="group" aria-label="보기">
    <button class="tab" id="tab-sale" aria-pressed="true">할인 중</button>
    <button class="tab" id="tab-all" aria-pressed="false">전체 와인</button>
    <select id="sort" aria-label="정렬">
      <option value="pct">할인율순</option>
      <option value="end">종료임박</option>
      <option value="low" selected>낮은가격</option>
      <option value="high">높은가격</option>
    </select>
    <div class="zoom" role="group" aria-label="글자 크기">
      <button class="zb" id="zm" aria-label="글자 작게">가−</button>
      <span class="zv" id="zv">80%</span>
      <button class="zb" id="zp" aria-label="글자 크게">가+</button>
    </div>
  </div>
  <div class="row" role="group" aria-label="종류">
    <span id="types" style="display:contents"></span>
    <input id="q" type="search" placeholder="와인 이름 검색" aria-label="와인 이름 검색">
  </div>
</div>
<main>
  <div class="grid" id="grid"></div>
  <p class="note">제품 사진은 코코홀릭 상품 사진을 불러온 것이고, 사진이 없는 와인은 종류별 병 그림으로 보여요.<br>
  가격과 행사 기간은 지점·재고에 따라 다를 수 있으니 매장 가격표나 코스트코 앱으로 한 번 더 확인하세요. 행사 종료일이 지난 상품은 자동으로 정상가로 바뀌어 표시됩니다.<br>
  자료: <a href="https://www.cocodalin.com/discount?category_id=11">코코달인 음료·주류 할인</a>, <a href="https://www.cocoholic.com/tags/%EB%A0%88%EB%93%9C%EC%99%80%EC%9D%B8">코코홀릭 레드와인</a>, <a href="https://www.cocoholic.com/tags/%ED%99%94%EC%9D%B4%ED%8A%B8%EC%99%80%EC%9D%B8">코코홀릭 화이트와인</a>, <a href="https://www.cocoholic.com/tags/%EC%8A%A4%ED%8C%8C%ED%81%B4%EB%A7%81%EC%99%80%EC%9D%B8">코코홀릭 스파클링</a></p>
</main>
<script src="wines.js"></script>
<script>
{
const RAW=window.WINES||[];
const LQ=new URLSearchParams(location.search).get("l");if(/^[abc]$/.test(LQ||""))document.documentElement.dataset.l=LQ;
const TYPES={R:"레드",W:"화이트",S:"스파클링",D:"디저트·기타"};
const now=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Seoul"}));now.setHours(0,0,0,0);
const day=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const won=n=>n.toLocaleString("ko-KR")+"원";
const W=RAW.map(([n,t,reg,sale,st,en],i)=>{
  let left=null,on=false;
  if(sale&&en){left=Math.round((day(en)-now)/864e5);on=left>=0&&(!st||day(st)<=now)}
  const price=on?sale:reg;
  const m=n.match(/(\d+(?:\.\d+)?)\s*(ML|L)$/i);const ml=m?parseFloat(m[1])*(m[2].toUpperCase()=="L"?1000:1):750;
  const name=n.replace(/\s*\d+(\.\d+)?\s*(ML|L)$/i,"");
  return{i,n:name,ph:(window.IMG||{})[n]||"",vol:m?m[0]:"",t,reg,sale,en,left,on,price,pct:on?Math.round((reg-sale)/reg*100):0,per:Math.round(price/ml*750),
    img:"https://www.google.com/search?tbm=isch&q="+encodeURIComponent("코스트코 "+name+" 와인")}
});
let view="sale",type="",sort="low",q="",z=.8;
const $=id=>document.getElementById(id);
const U=(window.UPDATED||"").split("-");$("upd").textContent=U.length==3?`${+U[0]}년 ${+U[1]}월 ${+U[2]}일`:"";
const sales=W.filter(w=>w.on);
const best=sales.slice().sort((a,b)=>b.pct-a.pct)[0];
const soon=sales.filter(w=>w.left<=1).length;
$("stats").innerHTML=[
  [sales.length+"종","지금 할인 중"],
  [best?best.pct+"%":"-","최대 할인율"],
  [soon+"종","내일까지 종료"]
].map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");
$("types").innerHTML=[["","전체"],...Object.entries(TYPES)].map(([k,v])=>`<button class="chip" data-t="${k}" aria-pressed="${k===""}">${v}</button>`).join("");
const dd=w=>w.left===0?"오늘 종료":w.left===1?"내일 종료":`D-${w.left}`;
function draw(){
  let L=(view==="sale"?sales:W).filter(w=>(!type||w.t===type)&&(!q||w.n.toLowerCase().includes(q)));
  const S={pct:(a,b)=>b.pct-a.pct||a.price-b.price,end:(a,b)=>(a.on?a.left:999)-(b.on?b.left:999)||b.pct-a.pct,low:(a,b)=>a.price-b.price,high:(a,b)=>b.price-a.price};
  L.sort(S[sort]);
  $("grid").innerHTML=L.length?L.map(w=>`<article class="t${w.on?" sale":""}">
    <div class="pic"><svg class="bt" viewBox="0 0 30 80" aria-hidden="true"><use href="#b-${w.t}"/></svg>${w.ph?`<img class="ph" src="${w.ph}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}</div>
    <div class="bd">
      <div class="k"><span>${TYPES[w.t]} · ${w.vol}</span>${w.on?`<span class="dd${w.left<=1?" hot":""}">${dd(w)}</span>`:""}</div>
      <h3>${w.n}</h3>
      <div class="p"><b>${won(w.price)}</b>${w.on?`<s>${won(w.reg)}</s>`:""}</div>
      ${w.on?`<div class="off">−${won(w.reg-w.sale)} (${w.pct}%) · ~${w.en.slice(5).replace("-","/")}까지</div>`:""}
      ${w.vol!=="750ML"?`<div class="per">750ML 환산 ${won(w.per)}</div>`:""}
    </div>
  </article>`).join(""):`<div class="empty">조건에 맞는 와인이 없어요.</div>`;
}
const setZ=v=>{z=Math.min(1,Math.max(.5,Math.round(v*10)/10));document.documentElement.style.setProperty("--z",z);$("zv").textContent=Math.round(z*100)+"%";try{localStorage.setItem("wineZ3",z)}catch(e){}};
try{const s=parseFloat(localStorage.getItem("wineZ3"));if(s)setZ(s)}catch(e){}
$("zm").onclick=()=>setZ(z-.1);$("zp").onclick=()=>setZ(z+.1);
const setTab=v=>{view=v;$("tab-sale").setAttribute("aria-pressed",v==="sale");$("tab-all").setAttribute("aria-pressed",v==="all");draw()};
$("tab-sale").onclick=()=>setTab("sale");$("tab-all").onclick=()=>setTab("all");
$("types").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;type=b.dataset.t;document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b));draw()};
$("sort").onchange=e=>{sort=e.target.value;draw()};
$("q").oninput=e=>{q=e.target.value.trim().toLowerCase();draw()};
draw();
}
</script>
</body>
</html>
